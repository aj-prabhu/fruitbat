<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fruitbat read-all harness</title>
    <script src="/coi-serviceworker.js"></script>
  </head>
  <body>
    <h1>Read all (S1-04 harness)</h1>
    <p id="status"></p>
    <textarea id="text" rows="10" cols="90"></textarea>
    <p>
      <button id="readall" type="button"></button>
      <button id="stop" type="button"></button>
      <button id="pause" type="button"></button>
      <button id="resume" type="button"></button>
      <button id="skip" type="button"></button>
      <label id="rate-label" for="rate"></label> <input id="rate" type="range" />
      <label id="voice-label" for="voice"></label> <select id="voice"></select>
    </p>
    <p id="now"></p>
    <script type="module" src="/src/readall.ts"></script>
  </body>
</html>
